services:
  # Listens on port 9187. Do not expose outside of the Docker host without TLS termination and
  # authentication.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.0
    env_file:
      - ./postgres/postgres_exporter.secrets.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring
      - backend
    restart: unless-stopped

  # Listens on port 9090. Do not expose outside of the Docker host without TLS termination and
  # authentication.
  prometheus:
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    secrets:
      - prometheus_lightning_token
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/var/prometheus
    networks:
      - monitoring
      - backend

  grafana:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: grafana/grafana:12.3.6
    restart: unless-stopped
    env_file:
      - ./grafana/grafana.secrets.env
      - ./grafana/grafana.env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_CHANGE: true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend
      - monitoring
    depends_on:
      - prometheus

  grafana-health:
    image: curlimages/curl:8.10.1
    depends_on:
      - grafana
    entrypoint:
      - curl
      - -f
      - --retry
      - "10"
      - --retry-delay
      - "3"
      - --retry-connrefused
      - http://grafana:3000/api/health
    networks:
      - monitoring

  # Listens on port 2375 - must NEVER be exposed outside of the Docker host.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:9abfc1fb82cc816c61c5b46a86927b62bd810a1e27a0628ad2d36d661cde6a59
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    networks:
      - monitoring-internal
    environment:
      - ALLOW_RESTARTS=0
      - ALLOW_STOP=0
      - ALLOW_START=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1
      - DISABLE_IPV6=0
      - DISTRIBUTION=0
      - EVENTS=1
      - EXEC=0
      - GRPC=0
      - IMAGES=1
      - INFO=1
      - LOG_LEVEL=info
      - NETWORKS=1
      - NODES=0
      - PING=1
      - PLUGINS=0
      - POST=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VERSION=1
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Listens on port 8080 - must NEVER be exposed outside of the Docker host.
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: unless-stopped
    networks:
      - monitoring
      - monitoring-internal
    depends_on:
      - docker-socket-proxy
    command:
      - --docker=tcp://docker-socket-proxy:2375
      - --docker_only
      - --housekeeping_interval=30s
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /proc:/rootfs/proc:ro
      - /var/lib/docker:/rootfs/var/lib/docker:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
      - /var/lib/docker:/var/lib/docker:ro,rslave
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro

  loki:
    image: grafana/loki:3.6.7
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.13.2
    restart: unless-stopped
    networks:
      - monitoring
      - monitoring-internal
    depends_on:
      - docker-socket-proxy
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

networks:
  backend:
  frontend:
  monitoring:
  monitoring-internal:
    driver: bridge
    internal: true

volumes:
  grafana_data:
  loki_data:
  prometheus_data:

secrets:
  prometheus_lightning_token:
    file: prometheus/prometheus_lightning_token.txt
