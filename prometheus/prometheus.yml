global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'lightning'
    dns_sd_configs:
      - names: ["lightning"]
        type: 'A'
        port: 4000
        refresh_interval: 10s
    authorization:
      type: 'Bearer'
      credentials_file: '/run/secrets/prometheus_lightning_token'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
